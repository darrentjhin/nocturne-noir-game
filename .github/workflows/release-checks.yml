name: Release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nocturne-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run syntax, contract, privacy, and state-machine tests
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run both complete two-player paths
        shell: bash
        run: |
          set -euo pipefail
          SEAT_RELEASE_MS=1000 node server/index.js > /tmp/nocturne-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/nocturne-server.log
              exit 1
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/api/health
          npm run smoke -- http://127.0.0.1:4173
          npm run smoke:case2 -- http://127.0.0.1:4173

      - name: Install browser used by interface tests
        run: npx playwright install --with-deps chromium

      - name: Run real two-browser onboarding tests
        run: npm run test:e2e
